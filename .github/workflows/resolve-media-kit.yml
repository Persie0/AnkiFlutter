name: Resolve media-kit lockfile

on:
  push:
    branches:
      - feat/reviewer-parity
    paths:
      - app/pubspec.yaml
      - .github/workflows/resolve-media-kit.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/reviewer-parity
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        working-directory: app
        run: flutter pub get
      - name: Commit generated dependency state
        run: |
          git add app/pubspec.lock app/.metadata app/linux app/macos app/windows
          if git diff --cached --quiet; then
            echo "No generated dependency changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: resolve media kit dependencies"
          git pull --rebase origin feat/reviewer-parity
          git push origin HEAD:feat/reviewer-parity
