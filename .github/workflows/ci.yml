name: CI

on:
  pull_request:
  push:
    branches:
      - feat/first-desktop-vertical-slice

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
        working-directory: .
      - name: Install Dart protoc plugin
        run: dart pub global activate protoc_plugin 25.1.0
        working-directory: .
      - name: Generate Anki Dart protos
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          python3 tool/generate_dart_protos.py
        working-directory: .
      - run: flutter pub get
      - run: flutter test
      - run: flutter analyze

  rust_bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Use Rust 1.80
        run: |
          rustup toolchain install 1.80.0 --profile minimal
          rustup override set 1.80.0
      - name: Test bridge operation mapping
        run: cargo test --manifest-path native/anki_bridge/Cargo.toml --test operation_indices
