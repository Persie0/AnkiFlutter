name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - name: Use Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup override set 1.88.0
        working-directory: .
      - name: Install Linux desktop and protoc dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev xvfb
          protobuf-compiler
        working-directory: .
      - name: Install Dart protoc plugin
        run: dart pub global activate protoc_plugin 25.1.0
        working-directory: .
      - name: Generate Anki Dart protos
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          python3 tool/generate_dart_protos.py
        working-directory: .
      - run: flutter pub get
      - run: flutter test
      - run: flutter analyze
      - name: Real backend integration
        run: xvfb-run -a python3 tool/run_desktop_dev.py --test
        working-directory: .

  rust_bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Use Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup override set 1.88.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/anki_bridge/target
          key: rust-1.88-${{ runner.os }}-${{ hashFiles('third_party/anki/Cargo.lock', 'native/anki_bridge/Cargo.toml') }}
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Seed bridge lockfile from pinned Anki
        run: python3 tool/prepare_bridge_lock.py
      - name: Test bridge
        run: cargo test --manifest-path native/anki_bridge/Cargo.toml
