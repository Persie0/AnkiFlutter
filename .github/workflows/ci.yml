name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - name: Generate exact desktop platform scaffolds
        run: >-
          flutter create --platforms=linux,macos,windows --org dev.persie0
          --project-name anki_flutter /tmp/anki_flutter_scaffold
      - name: Stage pinned desktop project scaffolds
        run: |
          rm -rf app/macos app/windows
          cp -R /tmp/anki_flutter_scaffold/macos app/macos
          cp -R /tmp/anki_flutter_scaffold/windows app/windows
          cp /tmp/anki_flutter_scaffold/.metadata app/.metadata
          cp /tmp/anki_flutter_scaffold/.gitignore app/.gitignore
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-platform-scaffolds
          path: |
            /tmp/anki_flutter_scaffold/linux
            /tmp/anki_flutter_scaffold/macos
            /tmp/anki_flutter_scaffold/windows
          include-hidden-files: true
      - name: Use Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup component add rustfmt clippy --toolchain 1.88.0
          rustup override set 1.88.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/anki_bridge/target
          key: rust-1.88-${{ runner.os }}-${{ hashFiles('third_party/anki/Cargo.lock', 'native/anki_bridge/Cargo.toml') }}
      - name: Install Linux desktop and protoc dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev xvfb
          protobuf-compiler
      - name: Install Dart protoc plugin
        run: |
          dart pub global activate protoc_plugin 25.1.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Generate Anki Dart protos
        run: python3 tool/generate_dart_protos.py
      - name: Verify generated Anki Dart protos
        run: python3 tool/verify_generated_protos.py
      - name: Seed bridge lockfile from pinned Anki
        run: python3 tool/prepare_bridge_lock.py
      - name: Check Rust formatting
        run: cargo fmt --manifest-path native/anki_bridge/Cargo.toml --check
      - name: Lint Rust bridge
        run: cargo clippy --manifest-path native/anki_bridge/Cargo.toml --all-targets -- -D warnings
      - name: Test Rust bridge
        run: cargo test --manifest-path native/anki_bridge/Cargo.toml
      - name: Resolve Flutter dependencies
        run: flutter pub get
        working-directory: app
      - name: Commit pinned generated Flutter inputs
        if: github.event_name == 'pull_request' && github.head_ref != ''
        run: |
          git fetch origin "$GITHUB_HEAD_REF"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git read-tree "origin/$GITHUB_HEAD_REF"
          git add app/.metadata app/.gitignore app/macos app/windows \
            app/lib/core/backend/generated app/pubspec.lock app/analysis_options.yaml
          if git diff --cached --quiet; then
            echo "Pinned generated project files are already committed."
            exit 0
          fi
          tree="$(git write-tree)"
          parent="$(git rev-parse "origin/$GITHUB_HEAD_REF")"
          commit="$(printf '%s\n' 'chore: commit pinned generated project files' | git commit-tree "$tree" -p "$parent")"
          git push origin "$commit:refs/heads/$GITHUB_HEAD_REF"
      - name: Analyze Flutter app
        run: flutter analyze
        working-directory: app
      - name: Test Flutter app
        run: flutter test
        working-directory: app
      - name: Build Linux bridge release
        run: cargo build --release --manifest-path native/anki_bridge/Cargo.toml
      - name: Build Flutter Linux app
        run: flutter build linux
        working-directory: app
      - name: Bundle Linux Anki bridge
        run: |
          cp native/anki_bridge/target/release/libanki_flutter_bridge.so app/build/linux/x64/release/bundle/
          test -f app/build/linux/x64/release/bundle/libanki_flutter_bridge.so
      - name: Real backend integration
        run: xvfb-run -a python3 tool/run_desktop_dev.py --test
